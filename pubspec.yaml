name: cusut
description: Personal scheduler for tailoring lessons — track sessions, reschedules, and know when it's time to pay for the next round.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_localizations:
    sdk: flutter
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
